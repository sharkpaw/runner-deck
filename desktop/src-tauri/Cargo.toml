[package]
name = "runner-deck-desktop"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sys-locale = "0.3"
getrandom = "0.3"
ureq = { version = "3", features = ["json"] }
sha2 = "0.10"
base64 = "0.22"

[profile.release]
strip = true
lto = true
opt-level = "s"
