# Release version consistency: the tag being cut, the baseline version in code, and CHANGELOG must all match.
#
# Why not rely on the existing check-version-consistency: it uses the
# default image tag in internal/config/config.go as the baseline, and only checks that the repo is internally self-consistent. The release process sits outside that baseline, so even when the baseline itself
# lags one version, the whole repo still looks consistent and that check stays green. v1.7.1 shipped exactly this way:  version-check-ignore
# The release was already cut, yet none of the 91 version references in the repo point to it, and its entry in CHANGELOG
# is still sitting under [Unreleased].
#
# Implemented as a composite action rather than copy-pasted into both release workflows: keeping two copies
# and changing only one is exactly the kind of mistake this repo has already made (the comment at the top of the Makefile records the same lesson).
name: Check release version consistency
description: Verify the tag matches the baseline version in internal/config/config.go and the CHANGELOG section

inputs:
  tag:
    description: The tag being released, e.g. v1.7.1  # version-check-ignore
    required: true

runs:
  using: composite
  steps:
    - shell: bash
      env:
        TAG: ${{ inputs.tag }}
      run: |
        set -euo pipefail
        cd "$GITHUB_WORKSPACE"

        conf=scripts/ci-recipes.conf
        # Read the baseline file and regex from ci-recipes.conf instead of repeating them here:
        # That file is already the single source of truth for this repo's version facts; each extra copy is another chance to drift.
        src=$(sed -n 's/^[[:space:]]*version_source[[:space:]]*=[[:space:]]*//p' "$conf" | head -1)
        re=$(sed -n 's/^[[:space:]]*version_baseline_regex[[:space:]]*=[[:space:]]*//p' "$conf" | head -1)
        if [ -z "$src" ] || [ -z "$re" ]; then
          echo "::error::version_source / version_baseline_regex not found in $conf"
          exit 1
        fi

        baseline=$(grep -oE "$re" "$src" | grep -oE 'v[0-9]+\.[0-9]+\.[0-9]+' | head -1 || true)
        if [ -z "$baseline" ]; then
          echo "::error file=$src::Could not parse the baseline version using version_baseline_regex from $conf"
          exit 1
        fi

        fail=0
        if [ "$baseline" != "$TAG" ]; then
          echo "::error file=$src::Baseline version is $baseline, but the tag being released is $TAG."
          echo "::error::Bump the baseline and the version numbers in docs and examples to $TAG before tagging"
          fail=1
        fi

        # CHANGELOG uses the form without v: ## [1.7.1] - 2026-09-21
        ver=${TAG#v}
        if ! grep -qF "## [$ver]" CHANGELOG.md; then
          echo "::error file=CHANGELOG.md::No ## [$ver] section found."
          echo "::error::Move the entries under [Unreleased] into ## [$ver] before tagging —"
          echo "::error::Release notes are generated from here; leaving the entries under Unreleased means this version ships with no change notes"
          fail=1
        fi
        if ! grep -qE "^\[$ver\]: " CHANGELOG.md; then
          echo "::error file=CHANGELOG.md::Missing [$ver]: link definition at the bottom; the section heading would render as plain text"
          fail=1
        fi

        [ "$fail" -eq 0 ] || exit 1
        echo "tag $TAG matches the baseline version and CHANGELOG"
