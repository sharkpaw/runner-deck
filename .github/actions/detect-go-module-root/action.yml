# Detect the Go module root (the directory containing go.mod and cmd/runner-manager), so single-repo and monorepo setups can both reuse it.
# Callers pass the desired root via env.WORKING_DIR (default .); if that directory has no cmd/runner-manager, the search falls back automatically.
name: Detect Go module root
description: Output the module root path `root` and whether it was `found` (true/false)

inputs:
  working_dir:
    description: Desired module root directory, such as `.` or a subdirectory
    required: false
    default: .

outputs:
  root:
    description: Module root directory path
    value: ${{ steps.detect.outputs.root }}
  found:
    description: Whether found (true/false)
    value: ${{ steps.detect.outputs.found }}

runs:
  using: composite
  steps:
    - id: detect
      shell: bash
      run: |
        set -e
        cd "$GITHUB_WORKSPACE"
        WORKING_DIR="${{ inputs.working_dir }}"
        ROOT=""
        if [ -d "$GITHUB_WORKSPACE/${WORKING_DIR}/cmd/runner-manager" ]; then
          ROOT="${WORKING_DIR}"
        fi
        if [ -z "$ROOT" ]; then
          ROOT=$(find . -name go.mod 2>/dev/null | while IFS= read -r f; do
            d=$(dirname "$f")
            if [ -d "$d/cmd/runner-manager" ]; then echo "$d"; break; fi
          done | head -1)
        fi
        if [ -z "$ROOT" ]; then
          FOUND_DIR=$(find . -type d -path '*/cmd/runner-manager' 2>/dev/null | head -1)
          if [ -n "$FOUND_DIR" ]; then
            ROOT=$(dirname "$(dirname "$FOUND_DIR")")
          fi
        fi
        if [ -n "$ROOT" ]; then
          echo "root=$ROOT" >> $GITHUB_OUTPUT
          echo "found=true" >> $GITHUB_OUTPUT
          echo "Using Go module root: $ROOT"
        else
          echo "root=." >> $GITHUB_OUTPUT
          echo "found=false" >> $GITHUB_OUTPUT
          echo "::notice::No go.mod + cmd/runner-manager found, skipping."
        fi
