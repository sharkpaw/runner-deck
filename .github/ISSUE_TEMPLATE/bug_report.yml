name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Troubleshooting almost always starts with the same few questions, so they are listed here. Filling them in usually saves a round of back-and-forth.
        Troubleshooting almost always starts with the same few questions, so they are asked up
        front. Filling them in usually saves a round trip.

        For security vulnerabilities, do not use this form. See [SECURITY.md](https://github.com/sharkpaw/runner-deck/blob/main/SECURITY.md).
        Do not report vulnerabilities here — see SECURITY.md.

  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, what you got.
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: |
        `GET /version`, the image tag, or `runner-manager -version`.
        From `GET /version`, the image tag, or `runner-manager -version`.
      placeholder: v2.0.0
    validations:
      required: true

  - type: dropdown
    id: mode
    attributes:
      label: Mode
      description: |
        `runners.container_mode`: whether each runner runs in its own container, or the runner process runs inside the Manager container.
        Whether each runner gets its own container, or the runner processes live inside the Manager.
      options:
        - "default (container_mode: false)"
        - "container mode (container_mode: true)"
        - not sure
    validations:
      required: true

  - type: dropdown
    id: backend
    attributes:
      label: In-job Docker backend
      description: |
        `runners.job_docker_backend`. This setting determines what jobs can reach, and many problems only appear under one of the options.
        It decides what a job can reach, and several problems only appear under one of them.
      options:
        - dind
        - host-socket
        - none
        - not sure
    validations:
      required: true

  - type: textarea
    id: preflight
    attributes:
      label: Startup self-check output
      description: |
        `docker compose logs runner-manager | grep '\[preflight'`

        At startup it checks the runners directory, Docker reachability, networking, the runner image and the job Docker backend.
        Failed checks include a ready-to-run fix command. **The message text is currently in Chinese** (a known limitation, see section 1 of the usage guide).

        It checks the runners directory, Docker reachability, the network, the runner image and
        the in-job Docker backend at boot, and names a fix for each failing item. The text is
        currently Chinese — a known limit, see section 1 of the User Guide.
      render: text

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: |
        `docker compose logs runner-manager --tail=200`. Remove tokens and passwords first.
        Please strip tokens and passwords first.
      render: text

  - type: textarea
    id: config
    attributes:
      label: Configuration
      description: |
        The relevant section in `config/config.yaml`, or the variable names set in `.env` (**do not paste the values**).
        The relevant part of `config/config.yaml`, or which variables you set in `.env`
        (names, **not values**).
      render: yaml

  - type: input
    id: host
    attributes:
      label: Host
      description: |
        Distribution and architecture, and the Server version from `docker version`. This tool only supports Linux on
        amd64 / arm64.
        Distro and architecture, plus the Server version from `docker version`. This tool is
        Linux-only, on amd64 / arm64.
      placeholder: Ubuntu 24.04, arm64, Docker 27.3.1
