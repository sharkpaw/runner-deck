# Repository consistency check: cross-file, cross-language holistic checks, independent of the Go CI.
#
# The first two jobs are unrelated to language/build and only read files. The third, quickstart, is the exception: it builds the image and brings up the container
# — because it verifies exactly "does following the docs actually work", and there is no way to verify that without executing it.
name: CI (Consistency)

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

env:
  # Both checks are provided by the runner-fleet recipe from soulteary/ci-recipes; this repo only supplies
  # scripts/ci-recipes.conf (base paths and regexes, ignore markers, scan pathspec, doc languages and
  # file list). This is the single source of truth for the version: the Makefile's check target reads it from this file via sed,
  # instead of each pinning its own copy — pinning in two places and forgetting to sync is exactly how checks go green locally and red in CI.
  #
  # The pin is a module pseudo-version rather than a short SHA: a pseudo-version is an exact module version that the proxy serves immutably
  # from cache; a short SHA must be resolved against the repo, and once the commit is unreachable (e.g. orphaned by a squash merge)
  # it can no longer be fetched. This pseudo-version corresponds to the merge commit on ci-recipes main that landed the runner-fleet recipe.
  # Switch to the tag once ci-recipes publishes one.
  #
  # The trailing version-check-ignore is required: this is ci-recipes' module version, not this repo's version number,
  # and the version consistency check only recognizes "a single vX.Y.Z literal". It is equally required after switching to a tag; that has nothing to do with the tag.
  CI_RECIPES_VERSION: "v0.0.0-20260921094536-68dc8a7f1123"  # version-check-ignore

# Each of the two jobs installs ci-recipes separately. Merging them into one job would save one install, but would also merge the two check names on the PR
# into one — required checks in branch protection that are matched by name would immediately fail to match. The two jobs run in parallel,
# so wall-clock time is unchanged; the only extra cost is runner minutes.
jobs:
  version:
    name: Version consistency
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Install ci-recipes
        run: |
          set -eu
          go install "github.com/soulteary/ci-recipes/cmd/ci-recipes@${CI_RECIPES_VERSION}"
          # setup-go only guarantees GOROOT/bin is on PATH; go install artifacts land in GOPATH/bin.
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      # Version numbers in docs and examples must match the default image tag in the code.
      # Releases v1.0.1 / v1.1.0 / v1.1.1 all missed this sync; following the README deployed an image version version-check-ignore
      # three releases behind. This step makes the next missed update fail directly on the PR.
      - name: Check version references are in sync
        run: ci-recipes runner-fleet check-version-consistency

  docs:
    name: Docs structure consistency
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Install ci-recipes
        run: |
          set -eu
          go install "github.com/soulteary/ci-recipes/cmd/ci-recipes@${CI_RECIPES_VERSION}"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      # The development.md in the five translations once lagged a full version behind (the four-plus-one sections added in v1.5.1/v1.6.0 were never carried over),  version-check-ignore
      # and nothing reports it: the translations are syntactically valid and the site renders as usual. The UI's i18n already has tests watching
      # the key sets for the six languages, but the docs half never had one; this step fills that gap.
      - name: Check translated docs match the English section structure
        run: ci-recipes runner-fleet check-docs-structure

  quickstart:
    name: Quick start runs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      # People who copy from the docs don't read through first to decide which lines to skip; they paste the whole block into the terminal. So this runs the whole block too.
      #
      # This step guards against a specific class of incident: in the quick start, the chown comes before mkdir -p runners,
      # so the first command always fails with `cannot access 'runners'`, and the block also chowns runners twice --
      # a typical result of two edits stacking up, with the whole block never run end to end. All six translations have the same wrong line numbers,
      # The heading-structure check and the version check both miss this, because neither executes anything.
      - name: Extract the quick start block from the guide
        run: |
          set -euo pipefail
          awk '
            /^### .*docker-compose/ { insec=1; next }
            insec && /^```bash$/    { inblk=1; next }
            inblk && /^```/         { exit }
            inblk                   { print }
          ' docs/guide.md > quickstart.sh
          if [ ! -s quickstart.sh ]; then
            echo "::error file=docs/guide.md::Failed to extract the bash block from the docker-compose quick start."
            echo "::error::If that section's heading or fence language tag is changed, the awk here must be updated too"
            exit 1
          fi
          echo "Extracted command block:"
          cat quickstart.sh

      # Do not pull the published image; build in place: in the version-bump PR, the image for the new tag does not exist yet
      # (the image is pushed by the release workflow triggered by the tag), so the pull is bound to fail, and that is exactly the PR that needs this step.
      - name: Build the Manager image locally
        run: docker build -t runner-deck:quickstart-ci .

      - name: Run it
        env:
          MANAGER_IMAGE: runner-deck:quickstart-ci
        run: bash -euxo pipefail quickstart.sh

      # Check /ready rather than /health: /health always returns 200 as long as the process is alive, so it stays green even if the mounted directory is not writable,
      # which only proves the container started. /ready returns 503 when the config cannot be read or the runner root directory is missing or not writable,
      # which is exactly the outcome this command block is meant to produce.
      - name: The deployment is actually ready
        run: |
          set -euo pipefail
          curl -fsS --retry 30 --retry-delay 2 --retry-connrefused \
            http://127.0.0.1:8080/ready

      - name: Logs on failure
        if: failure()
        run: docker compose logs --tail=200 || true

      - name: Tear down
        if: always()
        run: docker compose down -v || true
