# Builds the desktop app. A pull request only builds. On main, raising the version in tauri.conf.json
# publishes a release, and the fixed desktop-latest release keeps download links stable, because the
# repository's "latest" release belongs to the Manager.
name: Release (Desktop)

on:
  pull_request:
    paths:
      - 'desktop/**'
      - 'cmd/runner-manager/**'
      - 'internal/**'
      - '.github/workflows/release-desktop.yml'
  push:
    branches: [main]
    paths:
      - 'desktop/src-tauri/tauri.conf.json'
  workflow_dispatch:

concurrency:
  group: release-desktop-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.arch }})
    runs-on: macos-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: arm64, target: aarch64-apple-darwin }
          - { arch: x64, target: x86_64-apple-darwin }
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: oven-sh/setup-bun@v2
      - name: Add the Rust target
        run: rustup target add ${{ matrix.target }}
      - name: Test the app
        if: matrix.arch == 'arm64'
        working-directory: desktop/src-tauri
        run: |
          mkdir -p ../ui binaries
          touch binaries/runner-manager-aarch64-apple-darwin
          cargo test --release
      - name: Build
        working-directory: desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # Without a certificate the build stays ad hoc signed. Tauri reads a set but empty variable as a value.
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [ -z "$(printenv "$name")" ]; then unset "$name"; fi
          done
          bun install --frozen-lockfile
          # A pull request from a fork has no key, and has no use for an update package either.
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            bunx tauri build --bundles app,dmg --target ${{ matrix.target }} --config '{"bundle":{"createUpdaterArtifacts":true}}'
          else
            bunx tauri build --bundles dmg --target ${{ matrix.target }}
          fi
      - name: Name the downloads
        run: |
          bundle=desktop/src-tauri/target/${{ matrix.target }}/release/bundle
          mkdir out
          mv "$bundle"/dmg/*.dmg out/RunnerDeck-macos-${{ matrix.arch }}.dmg
          if ls "$bundle"/macos/*.app.tar.gz >/dev/null 2>&1; then
            mv "$bundle"/macos/*.app.tar.gz out/RunnerDeck-macos-${{ matrix.arch }}.app.tar.gz
            mv "$bundle"/macos/*.app.tar.gz.sig out/RunnerDeck-macos-${{ matrix.arch }}.app.tar.gz.sig
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: dmg-${{ matrix.arch }}
          path: out/*
          if-no-files-found: error

  publish:
    name: Publish
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish the release
        run: |
          version="$(jq -r .version desktop/src-tauri/tauri.conf.json)"
          tag="desktop-v${version}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "$tag is already published; raise the version in tauri.conf.json to publish again."
            exit 0
          fi
          # Without the signing key there is nothing installed apps could accept, so stop here.
          base="https://github.com/${GH_REPO}/releases/download/${tag}"
          jq -n --arg version "$version" \
            --arg arm "$base/RunnerDeck-macos-arm64.app.tar.gz" --rawfile armsig dist/RunnerDeck-macos-arm64.app.tar.gz.sig \
            --arg x64 "$base/RunnerDeck-macos-x64.app.tar.gz" --rawfile x64sig dist/RunnerDeck-macos-x64.app.tar.gz.sig \
            '{version: $version, platforms: {
              "darwin-aarch64": {url: $arm, signature: ($armsig | rtrimstr("\n"))},
              "darwin-x86_64": {url: $x64, signature: ($x64sig | rtrimstr("\n"))}
            }}' > dist/latest.json
          gh release create "$tag" dist/*.dmg dist/*.app.tar.gz dist/latest.json --target "$GITHUB_SHA" --latest=false \
            --title "Runner Deck Desktop ${version}" \
            --notes "Install steps: https://github.com/${GH_REPO}/blob/main/desktop/README.md"
          if gh release view desktop-latest >/dev/null 2>&1; then
            gh release upload desktop-latest dist/*.dmg dist/latest.json --clobber
            gh release edit desktop-latest --title "Runner Deck Desktop (latest: ${version})"
          else
            gh release create desktop-latest dist/*.dmg dist/latest.json --target "$GITHUB_SHA" --latest=false \
              --title "Runner Deck Desktop (latest: ${version})" \
              --notes "Always holds the newest desktop app, so its download links do not change."
          fi
