# push main/master or tag: build and push the Runner container image to GHCR (tag gets a -runner suffix)
name: Publish image (Runner)

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: publish-runner-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    name: Build and push Runner image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # Fail right away if any item is missing, instead of emitting only a warning and skipping the remaining steps.
      # The old logic was: missing list item → set a false output → every step's if fails below
      # → job ends green with only a warning. So pushing a v* tag creates the release and the
      # tag, but no new image appears on GHCR, and nothing turns red. The README tells users to start
      # the service from that tag. This fail-open was meant for the skeleton stage when the repo lacked full source
      # (the old hint said "commit the full source before building"), but that premise no longer holds: every item in the list is on the core path.
      #
      # The list is the build context contract. If you rename or move any item (for example, moving
      # the scripts/install-runner.sh logic into internal/runner), you must update this list too.
      - name: Verify build context (all source required by Dockerfile.runner present)
        run: |
          set -eu
          MISSING=""
          for f in go.mod go.sum cmd/runner-agent/main.go; do
            [ -f "$f" ] || MISSING="${MISSING} ${f}"
          done
          if [ -n "$MISSING" ]; then
            echo "::error::Files required for the Runner build are missing (${MISSING# }); the build context is incomplete."
            exit 1
          fi
          echo "Build context is complete."

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute canonical image name (lowercase)
        id: vars
        shell: bash
        run: |
          set -eu
          IMAGE_REF="${IMAGE_NAME:-$GITHUB_REPOSITORY}"
          CANONICAL_IMAGE="${REGISTRY}/${IMAGE_REF,,}"
          echo "canonical=${CANONICAL_IMAGE}" >> "$GITHUB_OUTPUT"

      - name: Get version for build
        id: version
        run: |
          VERSION=$(git describe --tags --abbrev=0 2>/dev/null || echo "dev-$(git rev-parse --short HEAD)")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Extract Docker metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.vars.outputs.canonical }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,format=short,prefix=sha-
            type=semver,pattern={{version}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=semver,pattern={{major}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v') }}

      - name: Prepare Runner tags (same image, tag suffix -runner)
        id: runner-tags
        run: |
          echo "tags<<EOF" >> "$GITHUB_OUTPUT"
          # metadata-action may output comma- or newline-separated values; convert each image:tag line to image:tag-runner
          echo "${{ steps.meta.outputs.tags }}" | tr ',' '\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' | while IFS= read -r line; do
            [ -z "$line" ] && continue
            if [[ "$line" == *:* ]]; then
              echo "$line" | sed 's/\(:.*\)$/\1-runner/'
            else
              echo "${line}:latest-runner"
            fi
          done >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Build and push Runner image (container mode)
        uses: docker/build-push-action@v6
        with:
          context: ${{ github.workspace }}
          file: ${{ github.workspace }}/Dockerfile.runner
          push: true
          tags: ${{ steps.runner-tags.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          # Scope is separate per workflow: a tag push triggers four build workflows at once,
          # and type=gha without a scope all lands on BuildKit's default scope=buildkit,
          # where they overwrite each other; once a layer one side is writing is replaced by the other's index, it becomes layer blob not_found.
          cache-from: type=gha,scope=publish-runner
          # ignore-error: cache export is only an optimization. The image has already been pushed by this point,
          # so a cache write failure must not mark a publish that already succeeded as red.
          cache-to: type=gha,mode=max,scope=publish-runner,ignore-error=true
