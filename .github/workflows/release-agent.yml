# On tag push v*.*.*: build and push the runner container image (Agent; tag gets -runner suffix)
name: Release (Runner)

on:
  push:
    tags:
      - 'v*.*.*'

concurrency:
  group: release-runner-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  release:
    name: Build and push Runner image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check release version consistency
        uses: ./.github/actions/check-release-version
        with:
          tag: ${{ github.ref_name }}

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Run tests
        run: make test-coverage

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute canonical image name (lowercase for GHCR)
        id: vars
        shell: bash
        run: |
          set -eu
          CANONICAL="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          echo "canonical=${CANONICAL,,}" >> "$GITHUB_OUTPUT"

      - name: Extract metadata (for tag)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.vars.outputs.canonical }}
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=true

      - name: Prepare Runner tags (same image, tag suffix -runner)
        id: runner-tags
        run: |
          echo "tags<<EOF" >> "$GITHUB_OUTPUT"
          # metadata-action may output comma- or newline-separated values; convert each image:tag line to image:tag-runner
          echo "${{ steps.meta.outputs.tags }}" | tr ',' '\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' | while IFS= read -r line; do
            [ -z "$line" ] && continue
            if [[ "$line" == *:* ]]; then
              echo "$line" | sed 's/\(:.*\)$/\1-runner/'
            else
              echo "${line}:latest-runner"
            fi
          done >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Build and push Runner Docker image (container mode)
        uses: docker/build-push-action@v6
        with:
          context: ${{ github.workspace }}
          file: ${{ github.workspace }}/Dockerfile.runner
          push: true
          tags: ${{ steps.runner-tags.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Separate scope per workflow: a tag push triggers four build workflows at once,
          # and type=gha without an explicit scope all falls on BuildKit's default scope=buildkit,
          # so they overwrite each other; if another's index replaces a layer one is still writing, you get layer blob not_found.
          cache-from: type=gha,scope=release-runner
          # ignore-error: cache export is only an optimization. The image has already been pushed by this point,
          # so a cache write failure must not mark an already successful release as failed.
          cache-to: type=gha,mode=max,scope=release-runner,ignore-error=true
          platforms: linux/amd64,linux/arm64
