# Deploys to Coolify once both images of a main push are published. Does nothing until the
# COOLIFY_WEBHOOK and COOLIFY_TOKEN repository secrets exist.
name: Deploy to Coolify

on:
  workflow_run:
    workflows: ["Publish image (Manager)", "Publish image (Runner)"]
    types: [completed]
    branches: [main]

permissions:
  actions: read

concurrency:
  group: deploy-coolify
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    steps:
      - name: Trigger the deployment when both images are ready
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$COOLIFY_WEBHOOK" ] || [ -z "$COOLIFY_TOKEN" ]; then
            echo "Coolify secrets are not set, skipping."
            exit 0
          fi
          for workflow in publish-image-manager.yml publish-image-agent.yml; do
            conclusion=$(gh api "repos/$REPOSITORY/actions/workflows/$workflow/runs?head_sha=$HEAD_SHA&per_page=1" --jq '.workflow_runs[0].conclusion // ""')
            if [ "$conclusion" != "success" ]; then
              echo "$workflow is not finished for $HEAD_SHA ($conclusion), the other run will deploy."
              exit 0
            fi
          done
          curl -fsS --max-time 30 -H "Authorization: Bearer $COOLIFY_TOKEN" "$COOLIFY_WEBHOOK"
