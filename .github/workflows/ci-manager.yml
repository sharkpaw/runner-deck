# CI: Runner Manager tests and builds
name: CI (Manager)

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

env:
  WORKING_DIR: .

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Check both images share the apt manifest
        run: |
          for f in Dockerfile Dockerfile.runner; do
            grep -q 'scripts/apt-packages.txt' "$f" || {
              echo "::error file=$f::Image dependencies must be installed from scripts/apt-packages.txt; do not write a separate package list inside the Dockerfile (the two drifted in the past, see job failures after #4)"
              exit 1
            }
          done
          echo "Manager and Runner images both use the shared dependency list"

      - name: Detect Go module root
        id: modroot
        uses: ./.github/actions/detect-go-module-root
        with:
          working_dir: ${{ env.WORKING_DIR }}

      - name: Set up Go
        if: steps.modroot.outputs.found == 'true'
        uses: actions/setup-go@v6
        with:
          go-version-file: ${{ steps.modroot.outputs.root }}/go.mod
          cache-dependency-path: ${{ steps.modroot.outputs.root }}/go.sum

      - name: Vet
        if: steps.modroot.outputs.found == 'true'
        run: go vet ./cmd/runner-manager/... ./internal/...
        working-directory: ${{ steps.modroot.outputs.root }}

      - name: Lint
        if: steps.modroot.outputs.found == 'true'
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          args: --max-same-issues=100000 ./cmd/runner-manager/... ./internal/...
          working-directory: ${{ steps.modroot.outputs.root }}

      # -race: this project has a sizeable concurrency surface. The single-worker registration queue, the runnerOps lock,
      # and the "single winner" creation in EnsureAgentToken are all guaranteed by convention, not by the type system.
      # Race degradation is silent under plain go test. It only shows up in production as occasional odd state.
      - name: Run tests
        if: (steps.modroot.outputs.found == 'true') && (github.event_name != 'pull_request')
        run: go test -race -v ./cmd/runner-manager/...
        working-directory: ${{ steps.modroot.outputs.root }}

      - name: Skip (no project structure)
        if: steps.modroot.outputs.found != 'true'
        run: 'echo "Skipped: no go.mod + cmd/runner-manager in this repo."'

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [test]
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Detect Go module root
        id: modroot
        uses: ./.github/actions/detect-go-module-root
        with:
          working_dir: ${{ env.WORKING_DIR }}

      - name: Set up Go
        if: steps.modroot.outputs.found == 'true'
        uses: actions/setup-go@v6
        with:
          go-version-file: ${{ steps.modroot.outputs.root }}/go.mod
          cache-dependency-path: ${{ steps.modroot.outputs.root }}/go.sum

      - name: Get version information
        if: steps.modroot.outputs.found == 'true'
        id: version
        run: |
          VERSION=$(git describe --tags --abbrev=0 2>/dev/null || echo "dev-$(git rev-parse --short HEAD)")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Build Manager
        if: steps.modroot.outputs.found == 'true'
        run: |
          go build -ldflags "-s -w -X main.Version=${{ steps.version.outputs.version }} -X main.Commit=${{ github.sha }} -X main.BuildDate=$(date -u +%Y-%m-%dT%H:%M:%SZ)" -o runner-manager ./cmd/runner-manager
        working-directory: ${{ steps.modroot.outputs.root }}

      - name: Init example config
        if: steps.modroot.outputs.found == 'true'
        run: mkdir -p config && cp config.yaml.example config/config.yaml
        working-directory: ${{ steps.modroot.outputs.root }}

      - name: Verify binary
        if: steps.modroot.outputs.found == 'true'
        run: |
          ./runner-manager -version
          ./runner-manager -config config/config.yaml &
          PID=$!
          trap "kill $PID 2>/dev/null || true; wait $PID 2>/dev/null || true" EXIT
          for i in 1 2 3 4 5; do sleep 1; curl -sf http://localhost:8080/health | grep -q '"status":"ok"' && break; done
          curl -sf http://localhost:8080/health | grep -q '"status":"ok"' || (echo "health check failed"; exit 1)
          kill $PID 2>/dev/null || true
          wait $PID 2>/dev/null || true
        working-directory: ${{ steps.modroot.outputs.root }}

      - name: Skip (no project structure)
        if: steps.modroot.outputs.found != 'true'
        run: 'echo "Skipped: no go.mod + cmd/runner-manager in this repo."'

  image:
    name: Image build context
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      # Paired with the same-named job in CI (Agent). The image's builder stage only COPYs part of the workspace,
      # so go build in the full workspace can't catch a missing path in the build context. The Manager side currently COPYs all of cmd and
      # internal and has never had a problem. This step guards against it someday being narrowed like Dockerfile.runner.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Verify both Linux image binary architectures
        run: scripts/test-image-architecture.sh Dockerfile runner-manager
