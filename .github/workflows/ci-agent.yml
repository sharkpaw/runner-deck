# CI: Test and build for the Runner Agent
name: CI (Agent)

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

env:
  WORKING_DIR: .

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Detect Go module root
        id: modroot
        uses: ./.github/actions/detect-go-module-root
        with:
          working_dir: ${{ env.WORKING_DIR }}

      - name: Set up Go
        if: steps.modroot.outputs.found == 'true'
        uses: actions/setup-go@v6
        with:
          go-version-file: ${{ steps.modroot.outputs.root }}/go.mod
          cache-dependency-path: ${{ steps.modroot.outputs.root }}/go.sum

      - name: Vet
        if: steps.modroot.outputs.found == 'true'
        run: go vet ./cmd/runner-agent/... ./internal/...
        working-directory: ${{ steps.modroot.outputs.root }}

      - name: Lint
        if: steps.modroot.outputs.found == 'true'
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          args: --max-same-issues=100000 ./cmd/runner-agent/... ./internal/...
          working-directory: ${{ steps.modroot.outputs.root }}

      # -race: this project has a sizable concurrency surface — the single-worker registration queue, the runnerOps lock,
      # and the "single winner" creation in EnsureAgentToken are all guaranteed by convention rather than by the type system.
      # Race degradation is silent under a plain go test; it only shows up in production as occasional odd state.
      - name: Run tests
        if: (steps.modroot.outputs.found == 'true') && (!(github.event_name == 'pull_request'))
        run: go test -race -v ./cmd/runner-agent/... ./internal/...
        working-directory: ${{ steps.modroot.outputs.root }}

      - name: Remove stale generated report evidence
        id: report_cleanup
        if: "!cancelled() && (github.event_name == 'pull_request')"
        shell: bash
        run: |
          set -euo pipefail
          test ! -L .github
          rm -f -- .github/go-test-report.md .github/go-test-report.json .github/coverage.svg .github/goreportcard.svg .github/goreportcard-report.md
          rm -rf -- .github/test-results
      - name: Test, race and coverage (GTR v1.1.2)  # version-check-ignore: third-party tool version
        id: go_test_report
        uses: soulteary/go-test-report-action@bf04b539f7bf2a6f67d602da4259904b3dcdeba1  # v1.1.2  # version-check-ignore: third-party tool version
        with:
          directory: "."
          packages: "./..."
          race: "true"
          coverage_threshold: "0"
          test_args: "-count=1"
          version: "v1.1.2"  # version-check-ignore: third-party tool version
          cover_mode: "atomic"
          commit: "false"
        if: github.event_name == 'pull_request'
      - name: Go quality report (v1.1.3)  # version-check-ignore: third-party tool version
        if: "!cancelled() && (github.event_name == 'pull_request') && steps.report_cleanup.outcome == 'success'"
        id: go_report_card
        uses: soulteary/goreportcard-action@fc43049a5fe61c3313294d217c2a783f375a7970  # v1.1.3  # version-check-ignore: third-party tool version
        with:
          directory: "."
          version: "v1.1.3"  # version-check-ignore: third-party tool version
          threshold: "0"
          report: "true"
          commit: "false"
      - name: Reuse GTR coverage profile
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          PROFILE: ${{ steps.go_test_report.outputs.coverage_profile }}
        run: |-
          cp "$PROFILE" coverage.out
      - name: Skip (no project structure)
        if: steps.modroot.outputs.found != 'true'
        run: 'echo "Skipped: no go.mod + cmd/runner-agent in this repo."'

      - name: Upload read-only PR quality evidence
        if: "always() && steps.report_cleanup.outcome == 'success' && ((github.event_name == 'pull_request'))"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr-go-quality-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .github/go-test-report.md
            .github/go-test-report.json
            .github/coverage.svg
            .github/goreportcard.svg
            .github/goreportcard-report.md
            .github/test-results/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
    permissions:
      contents: read
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [test]
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Detect Go module root
        id: modroot
        uses: ./.github/actions/detect-go-module-root
        with:
          working_dir: ${{ env.WORKING_DIR }}

      - name: Set up Go
        if: steps.modroot.outputs.found == 'true'
        uses: actions/setup-go@v6
        with:
          go-version-file: ${{ steps.modroot.outputs.root }}/go.mod
          cache-dependency-path: ${{ steps.modroot.outputs.root }}/go.sum

      - name: Build Runner Agent
        if: steps.modroot.outputs.found == 'true'
        run: go build -o runner-agent ./cmd/runner-agent
        working-directory: ${{ steps.modroot.outputs.root }}

      - name: Verify binary
        if: steps.modroot.outputs.found == 'true'
        run: test -x runner-agent && ls -la runner-agent
        working-directory: ${{ steps.modroot.outputs.root }}

      - name: Skip (no project structure)
        if: steps.modroot.outputs.found != 'true'
        run: 'echo "Skipped: no go.mod + cmd/runner-agent in this repo."'

  image:
    name: Image build context
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      # The Build above runs go build over the full workspace, but the image's builder stage only COPYs part of it,
      # so the two have different capabilities: if the Agent newly imports an internal package, Build passes, yet the image build fails outright.
      # #25 slipped through exactly this way, and every push to main after that turned Publish image (Runner) red.
      # This builds the builder stage once for real, using the Dockerfile's own COPY list — no separate path list is maintained,
      # so it cannot drift from the Dockerfile. Only the builder is built: the runtime stage's apt install is irrelevant to publishing,
      # and what needs checking is whether the build context is enough to compile this binary.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Verify both Linux image binary architectures
        run: scripts/test-image-architecture.sh Dockerfile.runner runner-agent
