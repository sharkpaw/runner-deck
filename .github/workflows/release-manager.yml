# On tag push v*.*.*: build the Manager binary and image, and create a GitHub Release
name: Release (Manager)

on:
  push:
    tags:
      - 'v*.*.*'

concurrency:
  group: release-manager-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check release version consistency
        uses: ./.github/actions/check-release-version
        with:
          tag: ${{ github.ref_name }}

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Run tests
        run: make test-coverage

      - name: Extract version from tag
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          VERSION=${VERSION#v}
          COMMIT=$(git rev-parse --short HEAD)
          BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          echo "commit=$COMMIT" >> $GITHUB_OUTPUT
          echo "build_date=$BUILD_DATE" >> $GITHUB_OUTPUT

      - name: Build Manager binaries
        run: |
          dist_dir="$RUNNER_TEMP/runner-deck-dist"
          mkdir -p "$dist_dir"
          VERSION=${{ steps.version.outputs.version }}
          LDFLAGS="-s -w -X main.Version=v${VERSION} -X main.Commit=${{ steps.version.outputs.commit }} -X main.BuildDate=${{ steps.version.outputs.build_date }}"
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -ldflags "${LDFLAGS}" -o "$dist_dir/runner-manager-linux-amd64" ./cmd/runner-manager
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -ldflags "${LDFLAGS}" -o "$dist_dir/runner-manager-linux-arm64" ./cmd/runner-manager
          GOOS=darwin GOARCH=amd64 CGO_ENABLED=0 go build -ldflags "${LDFLAGS}" -o "$dist_dir/runner-manager-darwin-amd64" ./cmd/runner-manager
          GOOS=darwin GOARCH=arm64 CGO_ENABLED=0 go build -ldflags "${LDFLAGS}" -o "$dist_dir/runner-manager-darwin-arm64" ./cmd/runner-manager

      - name: Generate checksums
        run: |
          cd "$RUNNER_TEMP/runner-deck-dist"
          sha256sum * > checksums.txt

      # config/config.yaml is already produced by COPY config.yaml.example in the Dockerfile and sed, so the workflow needs no setup

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute canonical image name (lowercase for GHCR)
        id: vars
        shell: bash
        run: |
          set -eu
          CANONICAL="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          echo "canonical=${CANONICAL,,}" >> "$GITHUB_OUTPUT"

      - name: Extract metadata (Manager image)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.vars.outputs.canonical }}
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=true

      - name: Build and push Manager Docker image
        uses: docker/build-push-action@v6
        with:
          context: ${{ github.workspace }}
          file: ${{ github.workspace }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.version.outputs.tag }}
            COMMIT=${{ steps.version.outputs.commit }}
            BUILD_DATE=${{ steps.version.outputs.build_date }}
          # Scope is split per workflow: a tag push triggers all four build workflows at once,
          # and type=gha without an explicit scope lands on BuildKit's default scope=buildkit,
          # so they overwrite each other; once one side's index replaces a layer another is still writing, it becomes a layer blob not_found.
          cache-from: type=gha,scope=release-manager
          # ignore-error: cache export is only an optimization. The image has already been pushed by this point,
          # so a failed cache write must not mark an otherwise successful release red.
          cache-to: type=gha,mode=max,scope=release-manager,ignore-error=true
          platforms: linux/amd64,linux/arm64

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ runner.temp }}/runner-deck-dist/*
          name: Release ${{ steps.version.outputs.tag }}
          body_path: .github/release-notes.md
          draft: false
          prerelease: false
