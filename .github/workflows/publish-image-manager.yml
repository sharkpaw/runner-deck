# Build and push the Manager image to GHCR on push to main/master or tag
name: Publish image (Manager)

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: publish-manager-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    name: Build and push Manager image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # Missing any item fails the job immediately, instead of logging a warning and skipping later steps.
      # The old logic set a false output on a missing item, so every later step's if was false
      # and the job ended green with only a warning. So pushing a v* tag created the release and tag,
      # but no new image appeared on GHCR, and nothing turned red. The README tells users to start the service
      # from that tag. This fail-open was meant for the skeleton stage before the full source is in the repo
      # (the old hint said "commit the full source before building"). That premise no longer holds: every item in the list is a core path.
      #
      # The list is the contract for the build context. Whenever you rename or move any item,
      # for example moving the logic of scripts/install-runner.sh into internal/runner, update this list too.
      - name: Verify build context (source and config required by the Dockerfile are complete)
        run: |
          set -eu
          MISSING=""
          for f in go.mod go.sum config.yaml.example scripts/install-runner.sh; do
            [ -f "$f" ] || MISSING="${MISSING} ${f}"
          done
          for d in cmd cmd/runner-manager internal; do
            [ -d "$d" ] || MISSING="${MISSING} ${d}/"
          done
          if [ -n "$MISSING" ]; then
            echo "::error::Files required to build the Manager are missing (${MISSING# }); the build context is incomplete."
            exit 1
          fi
          echo "Build context is complete."

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute canonical image name (lowercase)
        id: vars
        shell: bash
        run: |
          set -eu
          IMAGE_REF="${IMAGE_NAME:-$GITHUB_REPOSITORY}"
          CANONICAL_IMAGE="${REGISTRY}/${IMAGE_REF,,}"
          echo "canonical=${CANONICAL_IMAGE}" >> "$GITHUB_OUTPUT"

      - name: Get version for build
        id: version
        run: |
          VERSION=$(git describe --tags --abbrev=0 2>/dev/null || echo "dev-$(git rev-parse --short HEAD)")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_OUTPUT

      - name: Extract Docker metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.vars.outputs.canonical }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,format=short,prefix=sha-
            type=semver,pattern={{version}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=semver,pattern={{major}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v') }}

      # The Dockerfile already COPYs config.yaml.example to config/config.yaml and runs sed, so the workflow does not need to prepare it

      - name: Build and push Manager image
        uses: docker/build-push-action@v6
        with:
          context: ${{ github.workspace }}
          file: ${{ github.workspace }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.version.outputs.version || 'dev' }}
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ steps.version.outputs.build_date }}
          platforms: linux/amd64,linux/arm64
          # Scope is separated per workflow: a tag push triggers four build workflows at once,
          # and type=gha without an explicit scope all lands on BuildKit's default scope=buildkit,
          # so they overwrite each other; a layer one job is writing gets replaced by another's index, which then yields layer blob not_found.
          cache-from: type=gha,scope=publish-manager
          # ignore-error: cache export is only an optimization. The image has already been pushed by this point,
          # so a failed cache write must not turn an already successful release red.
          cache-to: type=gha,mode=max,scope=publish-manager,ignore-error=true
