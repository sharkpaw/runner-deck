# Runner-fleet recipe reads this repo's own facts from here.
#
# Kept here rather than compiled into that binary, so that a change like "adding a seventh UI language" stays one commit in this repo,
# not an ci-recipes release plus a pin bump on this side. If this file is missing, the recipe falls back to
# built-in defaults, which are the values below; edit here to take effect, edit the defaults only with a release.
#
# Format: KEY = VALUE, # starts a comment. Unknown keys are an immediate error (a silently ignored typo is how a configured check
# quietly stops checking what it was configured to check). A list-type key replaces the default on first appearance, and appends thereafter.
#
# Usage: ci-recipes runner-fleet check-version-consistency
#       ci-recipes runner-fleet check-docs-structure

# Baseline version: the fallback tag for the default Runner image in internal/config/config.go. That is the only version number that
# actually affects runtime behavior; everything else is docs and examples and must match it.
version_source = internal/config/config.go
version_baseline_regex = tag = "(v[0-9]+\.[0-9]+\.[0-9]+)"

# Two reference shapes: literal vX.Y.Z, and main.Version=X.Y.Z in ldflags (compared as vX.Y.Z).
# Capture group 1 is the version; the template after => is what gets rendered for comparison.
version_reference_regex = (v[0-9]+\.[0-9]+\.[0-9]+)
version_reference_regex = main\.Version=([0-9]+\.[0-9]+\.[0-9]+) => v${1}

# When the body must cite a historical version number (e.g. a changelog note), add this marker on that line to skip it.
version_ignore_marker = version-check-ignore

# Scan scope, passed to git ls-files as git pathspecs, so matching semantics are git's.
# '*Dockerfile*' rather than 'Dockerfile*': the latter only matches the repo root and would miss
# examples under examples/runner-images/ that reference this repo's image tags.
version_globs = *.md *.yml *.yaml *.example Makefile *Dockerfile* *.sh *.go

# CHANGELOG naturally contains every historical version number, so it is not validated.
version_exclude = CHANGELOG.md

# Translated-doc section structure check: compares the heading level sequence, not heading text (which is supposed to be translated).
docs_root = docs
docs_languages = zh fr de ko ja
docs_files = development.md guide.md README.md

# docs_files lists only these three; this is the result of two overlapping boundaries, neither of which is an omission:
#
# 1. The other files under docs/ are deliberately not translated. ci-recipes-migration.md and
#    docs-improvement-plan.md are maintainer working notes, not product documentation.
# Part 2: the two examples/ READMEs are Chinese-only. This is a settled trade-off: docs-improvement-plan.md
#    section 7 offered three options and we picked B: only config.yaml.example and .env.example go bilingual
#    (every user copies them), while the 293 lines in examples/ stay in Chinese.
#    internal/docsconsistency's examples_policy_test.go enforces this policy. Adding a new
#    examples README requires first adding a line there, which means re-checking whether that trade-off still holds.
#
# This file governs which files must match the heading structure. Content volume under headings (table rows, code blocks, list items,
# link targets) is compared by translations_test.go in internal/docsconsistency, which reads the same
# docs_root / docs_languages / docs_files. Adding a seventh language still only changes the one line above.
