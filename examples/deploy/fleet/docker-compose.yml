services:
  runner-manager:
    image: ${MANAGER_IMAGE:-ghcr.io/sharkpaw/runner-deck:v2.1.0}
    container_name: runner-manager
    environment:
      DOCKER_HOST: unix:///var/run/docker.sock
      BASIC_AUTH_USER: ${BASIC_AUTH_USER:-admin}
      BASIC_AUTH_PASSWORD: ${BASIC_AUTH_PASSWORD:-}
      CONTAINER_MODE: ${CONTAINER_MODE:-true}
      RUNNERS_BASE_PATH: ${RUNNERS_BASE_PATH:-/app/runners}
      VOLUME_HOST_PATH: ${VOLUME_HOST_PATH:?Set VOLUME_HOST_PATH in .env to the absolute host path of the runners directory (realpath runners)}
      CONTAINER_NETWORK: ${CONTAINER_NETWORK:-runner-net}
      JOB_DOCKER_BACKEND: ${JOB_DOCKER_BACKEND:-host-socket}
      RUNNER_IMAGE: ${RUNNER_IMAGE:-}
      DOCKER_GID: ${DOCKER_GID:-}
      SERVER_PORT: ${SERVER_PORT:-8080}
      SERVER_ADDR: ${SERVER_ADDR:-0.0.0.0}
    ports:
      - "${MANAGER_PORT:-8080}:${SERVER_PORT:-8080}"
    volumes:
      - ./config:/app/config
      - ./runners:/app/runners
      - /var/run/docker.sock:/var/run/docker.sock
    group_add:
      - "${DOCKER_GID:-999}"
    networks:
      - runner-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:${SERVER_PORT:-8080}/health"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

  runner-image:
    profiles:
      - build
    image: ${RUNNER_IMAGE:-local/runner-deck-cached:v2.1.0-runner}
    build:
      context: .
      dockerfile: Dockerfile.runner-cached
      args:
        RUNNER_BASE_IMAGE: ${RUNNER_BASE_IMAGE:-ghcr.io/sharkpaw/runner-deck:v2.1.0-runner}
        NODE_VERSION: ${NODE_VERSION:-22.14.0}

  runner-dind:
    profiles:
      - dind
    image: docker:dind
    container_name: runner-dind
    privileged: true
    environment:
      DOCKER_TLS_CERTDIR: ""
    command: ["--tls=false"]
    volumes:
      - dind-storage:/var/lib/docker
    networks:
      - runner-net
    restart: unless-stopped

networks:
  runner-net:
    external: true

volumes:
  dind-storage:
