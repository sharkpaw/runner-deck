services:
  runner-manager:
    image: ${MANAGER_IMAGE:-ghcr.io/sharkpaw/runner-deck:v2.1.0}
    container_name: runner-manager
    environment:
      DOCKER_HOST: ${DOCKER_HOST:-unix:///var/run/docker.sock}
      BASIC_AUTH_USER: ${BASIC_AUTH_USER:-admin}
      BASIC_AUTH_PASSWORD: ${BASIC_AUTH_PASSWORD:-}
      RUNNERS_BASE_PATH: ${RUNNERS_BASE_PATH:-/app/runners}
      SERVER_PORT: ${SERVER_PORT:-8080}
      SERVER_ADDR: ${SERVER_ADDR:-0.0.0.0}
    ports:
      - "${MANAGER_PORT:-8080}:${SERVER_PORT:-8080}"
    volumes:
      - ./config:/app/config
      - ./runners:/app/runners
      - /var/run/docker.sock:/var/run/docker.sock
    group_add:
      - "${DOCKER_GID:-999}"
    networks:
      - runner-net
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:${SERVER_PORT:-8080}/health"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

  runner-dind:
    profiles:
      - dind
    image: docker:dind
    container_name: runner-dind
    privileged: true
    environment:
      DOCKER_TLS_CERTDIR: ""
    command: ["--tls=false"]
    volumes:
      - dind-storage:/var/lib/docker
    networks:
      - runner-net
    restart: unless-stopped

networks:
  runner-net:

volumes:
  dind-storage:
