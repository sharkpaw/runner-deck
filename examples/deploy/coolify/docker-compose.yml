# Runner Deck on Coolify. Assign a domain to runner-manager and deploy.
services:
  runner-manager:
    image: ghcr.io/sharkpaw/runner-deck:${RUNNER_DECK_TAG:-v2.0.0}
    # Root for the Docker socket and the /opt bind mounts; otherwise the host needs a
    # chown and the docker group id.
    user: "0:0"
    expose:
      - "8080"
    environment:
      # Coolify routes the domain to this port.
      SERVICE_URL_RUNNERMANAGER_8080:
      # Anyone in this UI can add a runner and run code, so the password is mandatory.
      BASIC_AUTH_USER: ${BASIC_AUTH_USER:-admin}
      BASIC_AUTH_PASSWORD: ${SERVICE_PASSWORD_RUNNERDECK:?Coolify generates this}
      DOCKER_HOST: unix:///var/run/docker.sock
      CONTAINER_MODE: "true"
      RUNNERS_BASE_PATH: /app/runners
      # Host path. If wrong, runners mount an empty directory and silently stay "new".
      VOLUME_HOST_PATH: /opt/runner-deck/runners
      CONTAINER_NETWORK: runner-net
      JOB_DOCKER_BACKEND: host-socket
      RUNNER_IMAGE: ghcr.io/sharkpaw/runner-deck:${RUNNER_DECK_TAG:-v2.0.0}-runner
      SERVER_PORT: "8080"
      SERVER_ADDR: 0.0.0.0
    volumes:
      - /opt/runner-deck/config:/app/config
      - /opt/runner-deck/runners:/app/runners
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - runner-net
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

networks:
  # Upstream's examples ask for a hand-made external network; a fixed name lets compose create it.
  runner-net:
    name: runner-net
