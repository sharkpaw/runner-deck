services:
  runner-manager:
    image: ${MANAGER_IMAGE:-ghcr.io/sharkpaw/runner-deck:v2.1.0}
    user: "0:0"
    expose:
      - "8080"
    environment:
      SERVICE_URL_RUNNER_MANAGER_8080:
      BASIC_AUTH_USER: ${BASIC_AUTH_USER:-admin}
      BASIC_AUTH_PASSWORD: ${SERVICE_PASSWORD_RUNNERDECK:?}
      DOCKER_HOST: unix:///var/run/docker.sock
      CONTAINER_MODE: ${CONTAINER_MODE:-true}
      RUNNERS_BASE_PATH: /app/runners
      VOLUME_HOST_PATH: ${VOLUME_HOST_PATH:-/opt/runner-deck/runners}
      CONTAINER_NETWORK: runner-net
      JOB_DOCKER_BACKEND: ${JOB_DOCKER_BACKEND:-host-socket}
      RUNNER_IMAGE: ${RUNNER_IMAGE:-ghcr.io/sharkpaw/runner-deck:v2.1.0-runner}
      DOCKER_GID: ${DOCKER_GID:-}
      SERVER_PORT: "8080"
      SERVER_ADDR: 0.0.0.0
    volumes:
      - /opt/runner-deck/config:/app/config
      - /opt/runner-deck/runners:/app/runners
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - runner-net
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

  runner-dind:
    profiles:
      - dind
    image: docker:dind
    privileged: true
    environment:
      DOCKER_TLS_CERTDIR: ""
    command: ["--tls=false"]
    volumes:
      - dind-storage:/var/lib/docker
    networks:
      - runner-net
    restart: unless-stopped

networks:
  runner-net:
    name: runner-net

volumes:
  dind-storage:
