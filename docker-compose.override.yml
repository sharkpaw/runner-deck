services:
  runner-manager:
    user: "1001:${DOCKER_GID:-999}"
    ports:
      - "${MANAGER_PORT:-8080}:8080"
    environment:
      CONTAINER_MODE: ${CONTAINER_MODE:-}
      VOLUME_HOST_PATH: ${VOLUME_HOST_PATH:-}
      JOB_DOCKER_BACKEND: ${JOB_DOCKER_BACKEND:-}
    volumes:
      - ./config:/app/config
      - ./runners:/app/runners

  runner-dind:
    profiles:
      - dind
    image: docker:dind
    privileged: true
    environment:
      DOCKER_TLS_CERTDIR: ""
    command: ["--tls=false"]
    volumes:
      - dind-storage:/var/lib/docker
    networks:
      - runner-net
    restart: unless-stopped

volumes:
  dind-storage:
